name: Patchbot Vulnerability Scanner
description: Vulnerability scanning with your own scanners and threat feeds, plus a coding agent that opens the fix PR.
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: Directory to scan
    default: "."
  config:
    description: Path to patchbot.toml
    required: false
  fail-on:
    description: Minimum severity that fails the job (critical|high|medium|low|none)
    default: "high"
  sarif-output:
    description: Path to write the SARIF report
    default: "patchbot.sarif"
  upload-sarif:
    description: Upload the SARIF report to GitHub Code Scanning
    default: "true"
  fix:
    description: Open auto-fix PRs for found vulnerabilities
    default: "false"
  agent:
    description: Coding agent to use for fixes (claude|codex|api|openai|managed)
    default: "claude"
  model:
    description: Model ID to pass to the agent (claude|codex|api|openai|managed)
    required: false
  max-prs:
    description: Max number of fix PRs to open per run
    default: "5"
  managed-agent-id:
    description: Managed Agents agent ID (from `patchbot managed init`), required when agent=managed
    required: false
  managed-environment-id:
    description: Managed Agents environment ID, required when agent=managed
    required: false
  managed-vault-id:
    description: Managed Agents vault ID, required when agent=managed
    required: false

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install patchbot
      shell: bash
      run: |
        if [ "${{ inputs.agent }}" = "api" ] || [ "${{ inputs.agent }}" = "managed" ]; then
          pip install "${{ github.action_path }}[yaml,api]"
        elif [ "${{ inputs.agent }}" = "openai" ]; then
          pip install "${{ github.action_path }}[yaml,openai]"
        else
          pip install "${{ github.action_path }}[yaml]"
        fi

    - name: Install agent CLI
      if: inputs.fix == 'true' && (inputs.agent == 'claude' || inputs.agent == 'codex')
      shell: bash
      run: |
        if [ "${{ inputs.agent }}" = "codex" ]; then
          npm install -g @openai/codex
        else
          npm install -g @anthropic-ai/claude-code
        fi

    - name: Scan
      id: scan
      shell: bash
      run: |
        set +e
        ARGS="${{ inputs.path }}"
        [ -n "${{ inputs.config }}" ] && ARGS="$ARGS --config ${{ inputs.config }}"
        patchbot scan $ARGS --format sarif -o "${{ inputs.sarif-output }}" --fail-on "${{ inputs.fail-on }}"
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-output }}

    - name: Open fix PRs
      if: inputs.fix == 'true'
      shell: bash
      env:
        PATCHBOT_MANAGED_AGENT_ID: ${{ inputs.managed-agent-id }}
        PATCHBOT_MANAGED_ENVIRONMENT_ID: ${{ inputs.managed-environment-id }}
        PATCHBOT_MANAGED_VAULT_ID: ${{ inputs.managed-vault-id }}
      run: |
        ARGS="${{ inputs.path }}"
        [ -n "${{ inputs.config }}" ] && ARGS="$ARGS --config ${{ inputs.config }}"
        [ -n "${{ inputs.model }}" ] && ARGS="$ARGS --model ${{ inputs.model }}"
        patchbot fix $ARGS --agent "${{ inputs.agent }}" --max "${{ inputs.max-prs }}" --pr

    - name: Fail on findings
      if: steps.scan.outputs.exit_code != '0'
      shell: bash
      run: exit 1
